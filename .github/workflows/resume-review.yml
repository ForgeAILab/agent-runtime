name: Resume compatibility regression
on:
  push:
    branches: [fix/smith-resume-upgrade-compat]
    paths: [.github/workflows/resume-review.yml]
permissions:
  contents: write
jobs:
  regression:
    if: github.ref == 'refs/heads/fix/smith-resume-upgrade-compat'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply reviewed source patch
        shell: bash
        run: |
          base64 --decode .github/resume-review.patch.gz.b64 | gzip --decompress > /tmp/resume-review.patch
          git apply --check /tmp/resume-review.patch
          git apply /tmp/resume-review.patch
          git diff --name-only -- '*.rs' > /tmp/review-rust-files
          xargs rustfmt --edition 2024 < /tmp/review-rust-files
          xargs git add -- < /tmp/review-rust-files
          git rm .github/resume-review.patch.gz.b64 .github/workflows/resume-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): interrupt stale activation checkpoints without replay'
          git push origin HEAD:fix/smith-resume-upgrade-compat
          git rev-parse HEAD > tested-revision.txt
      - name: Run interrupted-turn and upgrade regressions
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p agent-runtime --test interrupted_turn_admission 2>&1 | tee regression-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-regression-results
          path: |
            regression-results.txt
            tested-revision.txt
          retention-days: 3
