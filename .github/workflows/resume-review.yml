name: Resume compatibility regression
on:
  push:
    branches: [fix/smith-resume-upgrade-compat]
    paths: [.github/workflows/resume-review.yml]
permissions:
  contents: write
jobs:
  regression:
    if: github.ref == 'refs/heads/fix/smith-resume-upgrade-compat'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply boundary regression fix
        shell: bash
        run: |
          python3 .github/resume-followup.py
          git diff --name-only -- '*.rs' > /tmp/review-rust-files
          xargs rustfmt --edition 2024 < /tmp/review-rust-files
          xargs git add -- < /tmp/review-rust-files
          git rm .github/resume-followup.py .github/workflows/resume-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): preserve terminal decisions during upgrade interruption'
          git push origin HEAD:fix/smith-resume-upgrade-compat
          git rev-parse HEAD > tested-revision.txt
          git diff 52918447aede9d909a5a6a76914a82454f2b236a HEAD -- '*.rs' > source.patch
          git archive --format=tar.gz HEAD > source.tar.gz
      - name: Test runtime unit and integration suites
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p agent-runtime --tests 2>&1 | tee regression-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-regression-results
          path: |
            regression-results.txt
            tested-revision.txt
            source.patch
            source.tar.gz
          retention-days: 3
