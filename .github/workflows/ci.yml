name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting + lint gate. Clippy warnings are errors.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Build + test on macOS and Linux.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --workspace --all-features
      - name: test
        run: cargo test --workspace --all-features
      - name: doc tests
        run: cargo test --workspace --doc

  # Minimum-supported-Rust-version verification (compatibility-contract:
  # "Declared toolchain and license"). Production packages must build without a
  # newer compiler than the declared MSRV.
  #
  # Every production package is listed explicitly. A partial list is how an
  # MSRV violation reaches a release: a `let`-chain in a package nobody built
  # on 1.86 compiles fine on stable and fails only for the consumer.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - name: build production packages on MSRV
        run: >
          cargo build
          -p agent-runtime-registry
          -p agent-runtime-core
          -p agent-runtime-ability
          -p agent-runtime-provider
          -p agent-runtime-context
          -p agent-runtime-obs
          -p agent-runtime
      - name: build production packages on MSRV with all features
        run: >
          cargo build --all-features
          -p agent-runtime-registry
          -p agent-runtime-core
          -p agent-runtime-ability
          -p agent-runtime-provider
          -p agent-runtime-context
          -p agent-runtime-obs
          -p agent-runtime

  # Default-feature dependency boundaries (package-architecture: "Dependency-light
  # registry and ability packages"). These are contracts, not preferences: a
  # descriptor-only extension must not have to pull the runtime, and the registry
  # kernel must stay std-only.
  dependency-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: registry kernel is std-only by default
        run: |
          tree=$(cargo tree -p agent-runtime-registry --no-default-features -e normal)
          echo "$tree"
          test "$(echo "$tree" | grep -c .)" -eq 1
      - name: ability depends only on the registry kernel by default
        run: |
          tree=$(cargo tree -p agent-runtime-ability --no-default-features -e normal)
          echo "$tree"
          test "$(echo "$tree" | grep -c .)" -eq 2
          echo "$tree" | grep -q agent-runtime-registry
      - name: context builds without a provider or network client
        run: cargo build -p agent-runtime-context

  # Dependency + license policy, including the consumer-domain dependency ban.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Cross-consumer compatibility gate. A shared-runtime release candidate runs
  # the supported contract suites for each consumer. A failing consumer blocks a
  # compatible release unless it is explicitly declared breaking. The fixtures
  # under agent-runtime-testkit use only neutral host adapters, never consumer
  # domain types, so this job needs no consumer repository checkout.
  consumer-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: smith adapter contract suite
        run: cargo test -p agent-runtime-testkit --test consumer_smith
      - name: nyx adapter contract suite
        run: cargo test -p agent-runtime-testkit --test consumer_nyx
      - name: open-forge adapter contract suite
        run: cargo test -p agent-runtime-testkit --test consumer_open_forge
