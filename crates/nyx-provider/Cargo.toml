[package]
name = "nyx-provider"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "LLM provider traits and implementations for Nyx"
license.workspace = true
repository.workspace = true

[features]
default = ["compat"]
openai = []
claude = []
compat = ["openai"]
codex = []
oauth = ["nyx-security/oauth"]
cost = ["dep:nyx-obs", "dep:time"]
cost-sqlite = ["cost", "dep:rusqlite", "dep:nyx-store"]
model-cache-sqlite = ["dep:rusqlite", "dep:nyx-store"]

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nyx-security = { path = "../nyx-security" }
base64 = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = "0.1"
futures-core = "0.3"
futures-util = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true, optional = true }
nyx-store = { path = "../nyx-store", default-features = false, features = ["sqlite"], optional = true }
time = { version = "0.3", features = ["formatting", "parsing", "macros"], optional = true }
nyx-obs = { path = "../nyx-obs", optional = true }
nyx-core = { path = "../nyx-core", features = ["cost"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
