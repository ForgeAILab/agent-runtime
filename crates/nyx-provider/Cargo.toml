[package]
name = "nyx-provider"
version = "0.1.0"
edition = "2024"

[features]
default = ["compat"]
openai = []
claude = []
compat = ["openai"]
cost = ["dep:nyx-obs", "dep:nyx-tools", "dep:time"]
cost-sqlite = ["cost", "dep:rusqlite", "dep:nyx-store"]

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nyx-security = { path = "../nyx-security" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = "0.1"
futures-core = "0.3"
tracing = { workspace = true }
rusqlite = { version = "0.33", features = ["bundled"], optional = true }
nyx-store = { path = "../nyx-store", default-features = false, features = ["sqlite"], optional = true }
time = { version = "0.3", features = ["formatting", "parsing", "macros"], optional = true }
nyx-obs = { path = "../nyx-obs", optional = true }
nyx-tools = { path = "../nyx-tools", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
toml = "0.8"
tempfile = "3"
