[package]
name = "agent-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Embeddable agent runtime: provider adapters, direct agent loop, tool execution, and session facade"
keywords.workspace = true
categories.workspace = true

[dependencies]
agent-runtime-registry = { workspace = true, features = ["serde"] }
agent-runtime-core.workspace = true
agent-runtime-ability = { workspace = true, features = ["tool", "serde", "skill-files"] }
agent-runtime-provider.workspace = true
agent-runtime-context.workspace = true
agent-runtime-lcm.workspace = true
agent-runtime-obs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures-core.workspace = true
futures-util.workspace = true
async-stream.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
pin-project-lite.workspace = true
jsonschema.workspace = true
uuid.workspace = true
sha2.workspace = true

[features]
# The core loop, registry hub, ability catalog, provider mechanism, and
# context engine are always present — that is the supported facade. `obs`
# re-exports the optional sibling facade for one-stop consumption; leave it
# off to keep the graph lean (it pulls tokio channels, and its own `sqlite`
# feature pulls rusqlite).
default = []
obs = ["dep:agent-runtime-obs"]

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
agent-runtime-obs.workspace = true
agent-runtime-lcm = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
