[package]
name = "agent-runtime-lcm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Host-neutral lossless context memory identities, DAG contracts, planning, and bounded summarization"
keywords.workspace = true
categories.workspace = true

[dependencies]
agent-runtime-core.workspace = true
agent-runtime-context.workspace = true
agent-runtime-registry = { workspace = true, features = ["serde"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time", "macros"], optional = true }

[features]
default = []
# Real provider summarization; no adapter or product dependency is required.
provider-summary = ["dep:tokio", "dep:futures-util"]

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }

[lints]
workspace = true
