[package]
name = "agent-runtime-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Host-neutral contracts, events, errors, cancellation, usage, and adapter traits for the shared agent runtime"
keywords.workspace = true
categories.workspace = true

[dependencies]
# The registry kernel is std-only and sits below core: it owns the identity and
# fingerprint primitives that catalog profiles, snapshots, and plans all share.
agent-runtime-registry = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures-core.workspace = true
# Needed only by `check_set`'s `SecurityCheckSet`: `FutureExt::catch_unwind`
# contains a panicking check at its boundary (security-enforcement's "Bounded
# enforcement path") without `unsafe_code`, and `join_all` runs registered
# checks concurrently while preserving their sorted-by-id input order. Already
# a workspace dependency used by agent-runtime, agent-runtime-provider, and
# agent-runtime-obs; this is not a new third-party dependency.
futures-util.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }

[lints]
workspace = true
